<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">EduCanvas 完整架构总览</title>
  <desc id="desc">EduCanvas 从多入口，经 Gateway、Notebook 与统一 Agent Runtime，调用模型和受控能力，并将事实、事件和异步工作沉淀到 PostgreSQL 的架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0D223D"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39D7C2"/><stop offset="1" stop-color="#68A9FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020812" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5D7291"/></marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43D7C4"/></marker>
    <style>
      .title{font:700 42px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#F5F9FF}.subtitle{font:400 17px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#9EB1CB}.lane{font:600 14px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#8EA6C7;letter-spacing:2px}.cardTitle{font:600 19px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#F3F8FF}.cardText{font:400 14px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#AEBFD5}.small{font:500 12px 'PingFang SC','Noto Sans CJK SC',Arial,sans-serif;fill:#9FB3CD}.hot{fill:#56E1CB}.muted{fill:#7489A5}.line{fill:none;stroke:#5D7291;stroke-width:2;marker-end:url(#arrow)}.hotline{fill:none;stroke:#43D7C4;stroke-width:3.5;marker-end:url(#arrowHot)}.dash{fill:none;stroke:#E7A95A;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.bound{fill:#102847;stroke:#284969;stroke-width:1.25}.card{fill:#10233D;stroke:#294766;stroke-width:1.25}.hotcard{fill:#102D43;stroke:#43D7C4;stroke-width:1.5}.sidecard{fill:#102640;stroke:#476889;stroke-width:1.25}.future{fill:#0E1C31;stroke:#53667F;stroke-width:1.25;stroke-dasharray:5 5}.pill{fill:#173756}.warn{fill:#422E22}.db{fill:#0D3142;stroke:#43D7C4;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <path d="M0 155 H1920 M0 382 H1920 M0 634 H1920 M0 896 H1920" stroke="#1B3555" stroke-width="1"/>
  <text x="80" y="78" class="title">EduCanvas · 完整架构总览</text>
  <text x="82" y="112" class="subtitle">教育优先的个人 Agent 平台 · 以同一可信控制面连接多入口、长期上下文、受控行动与可恢复事实</text>
  <rect x="1520" y="57" width="318" height="46" rx="23" fill="url(#hero)" opacity=".14"/>
  <text x="1550" y="86" class="small" fill="#6EE8D7">当前架构 · 模块化单体 · 非 production</text>

  <text x="80" y="194" class="lane">01 / 受信入口与交互界面</text>
  <rect x="80" y="222" width="255" height="112" rx="18" class="card" filter="url(#shadow)"/>
  <circle cx="114" cy="260" r="13" fill="#68A9FF"/><text x="140" y="265" class="cardTitle">网页端</text><text x="108" y="295" class="cardText">以对话为主 · 工作室 · 画布</text><text x="108" y="317" class="small">共进程 BFF / SSE 兼容投影</text>
  <rect x="365" y="222" width="220" height="112" rx="18" class="card" filter="url(#shadow)"/>
  <circle cx="399" cy="260" r="13" fill="#B59CFF"/><text x="425" y="265" class="cardTitle">终端客户端</text><text x="393" y="295" class="cardText">第一方命令行入口</text><text x="393" y="317" class="small">共享消息与恢复语义</text>
  <rect x="615" y="222" width="240" height="112" rx="18" class="card" filter="url(#shadow)"/>
  <circle cx="649" cy="260" r="13" fill="#E7A95A"/><text x="675" y="265" class="cardTitle">受控消息渠道</text><text x="643" y="295" class="cardText">Telegram / 后续渠道</text><text x="643" y="317" class="small">按能力返回摘要与卡片</text>
  <rect x="885" y="222" width="250" height="112" rx="18" class="future"/>
  <circle cx="919" cy="260" r="13" fill="#71859F"/><text x="945" y="265" class="cardTitle">设备能力节点</text><text x="913" y="295" class="cardText">出站配对的设备能力</text><text x="913" y="317" class="small">L2 / L3 仍受严格边界</text>

  <text x="80" y="421" class="lane">02 / 控制面 · 身份 · 路由 · 操作记录</text>
  <rect x="80" y="452" width="470" height="140" rx="22" class="hotcard" filter="url(#shadow)"/>
  <rect x="106" y="478" width="66" height="28" rx="14" class="pill"/><text x="121" y="497" class="small" fill="#73E8D7">控制中心</text>
  <text x="106" y="535" class="cardTitle">网关：统一控制权</text><text x="106" y="563" class="cardText">身份 / 配对 · 笔记本路由 · 幂等操作 · 审批 · 规范化事件</text>
  <text x="106" y="582" class="small">gateway.v1 NDJSON（远程） · Web 保持 SSE 兼容层</text>
  <rect x="615" y="452" width="430" height="140" rx="22" class="card" filter="url(#shadow)"/>
  <rect x="641" y="478" width="98" height="28" rx="14" class="pill"/><text x="657" y="497" class="small">上下文归属</text>
  <text x="641" y="535" class="cardTitle">笔记本 / 对话</text><text x="641" y="563" class="cardText">资料 · 对话 · 产物/工作室 · 成员关系 · 按需画像</text>
  <text x="641" y="582" class="small">共享资源不继承私人 Memory、Credential、Node 或默认权限</text>
  <rect x="1110" y="452" width="330" height="140" rx="22" class="sidecard"/>
  <rect x="1136" y="478" width="70" height="28" rx="14" class="warn"/><text x="1151" y="497" class="small" fill="#F3C177">安全闸门</text>
  <text x="1136" y="535" class="cardTitle">审批 / 取消 / 恢复</text><text x="1136" y="563" class="cardText">显式确认 · 结果未知 · 可审计</text><text x="1136" y="582" class="small">高风险动作不由自然语言绕过</text>

  <text x="80" y="674" class="lane">03 / 唯一 Agent 循环 · 经校验的执行</text>
  <rect x="80" y="706" width="520" height="148" rx="22" class="hotcard" filter="url(#shadow)"/>
  <rect x="108" y="733" width="118" height="28" rx="14" class="pill"/><text x="123" y="752" class="small" fill="#73E8D7">唯一生产循环</text>
  <text x="108" y="792" class="cardTitle">Agent 运行时 · 轮次应用服务</text><text x="108" y="821" class="cardText">上下文快照 · 轮次预算 · 工具批执行 · 取消 · 终态 · 回放</text><text x="108" y="842" class="small">通用与 K12 仅注入画像/回调，不另建 Agent 循环</text>
  <rect x="665" y="706" width="300" height="148" rx="22" class="card" filter="url(#shadow)"/>
  <text x="693" y="755" class="cardTitle">模型网关</text><text x="693" y="785" class="cardText">稳定的模型调用端口</text><text x="693" y="807" class="small">供应商 SDK / 原始响应 / 密钥止步于此</text><text x="693" y="829" class="small">原生 / AI SDK 可回滚适配</text>
  <rect x="1030" y="706" width="350" height="148" rx="22" class="sidecard" filter="url(#shadow)"/>
  <text x="1058" y="755" class="cardTitle">工具策略解析器</text><text x="1058" y="785" class="cardText">主体 · 笔记本 · 画像 · 渠道 · 环境</text><text x="1058" y="807" class="small">五维交集 · Schema 校验 · 审批后二次收敛</text><text x="1058" y="829" class="small">模型输出是候选输入，不是授权来源</text>

  <text x="80" y="935" class="lane">04 / 领域能力 · 可信事实 · 异步恢复</text>
  <rect x="80" y="964" width="285" height="130" rx="20" class="card" filter="url(#shadow)"/>
  <text x="108" y="1010" class="cardTitle">受控工具 / 技能</text><text x="108" y="1038" class="cardText">检索 · 连接器 · 设备能力</text><text x="108" y="1060" class="small">按风险分层，副作用需审批</text>
  <rect x="405" y="964" width="300" height="130" rx="20" class="card" filter="url(#shadow)"/>
  <text x="433" y="1010" class="cardTitle">可信教育服务</text><text x="433" y="1038" class="cardText">Profile · 判分 · 掌握度 · 课程状态</text><text x="433" y="1060" class="small">只有服务端学习事件可更新事实</text>
  <rect x="745" y="964" width="280" height="130" rx="20" class="card" filter="url(#shadow)"/>
  <text x="773" y="1010" class="cardTitle">产物 / 工作室</text><text x="773" y="1038" class="cardText">结构契约 · 渲染器 · 不可变版本</text><text x="773" y="1060" class="small">可信结构化与隔离探索分层</text>
  <path d="M1084 982 C1135 955 1230 955 1275 982 L1275 1077 C1230 1105 1135 1105 1084 1077 Z" class="db" filter="url(#shadow)"/>
  <ellipse cx="1179" cy="982" rx="95" ry="20" fill="#16465B" stroke="#43D7C4" stroke-width="1.5"/><text x="1116" y="1025" class="cardTitle">PostgreSQL</text><text x="1106" y="1050" class="small">事实源 · Drizzle · 审计账本</text><text x="1107" y="1071" class="small">事件 / 消息 / 产物 / 操作记录</text>
  <rect x="1350" y="964" width="330" height="130" rx="20" class="sidecard" filter="url(#shadow)"/>
  <text x="1378" y="1010" class="cardTitle">持久任务执行器</text><text x="1378" y="1038" class="cardText">graphile-worker · 产物生成 · 资料摄取 · 音频</text><text x="1378" y="1060" class="small">事务入队 · 重启后可恢复</text>

  <path d="M207 334 V396 H170 V452" class="hotline"/><path d="M475 334 V382 H285 V452" class="hotline"/><path d="M735 334 V368 H400 V452" class="hotline"/><path d="M1010 334 V356 H1275 V452" class="line"/>
  <path d="M550 522 H615" class="hotline"/><path d="M1045 522 H1110" class="line"/><path d="M315 592 V706" class="hotline"/><path d="M830 592 V650 H520 V706" class="line"/>
  <path d="M600 780 H665" class="hotline"/><path d="M965 780 H1030" class="hotline"/><path d="M380 854 V964" class="line"/><path d="M650 854 V964" class="line"/><path d="M910 854 V964" class="line"/>
  <path d="M1179 854 V964" class="line"/><path d="M1025 1029 H1084" class="line"/><path d="M1280 1029 H1350" class="dash"/>
  <path d="M1350 1076 C1350 1145 480 1145 315 1094" class="dash"/>
  <path d="M1179 964 C1179 902 1290 902 1290 854" class="line"/>
  <path d="M80 1134 H1680" stroke="#294766" stroke-width="1"/>
  <circle cx="90" cy="1162" r="5" fill="#43D7C4"/><text x="104" y="1167" class="small">同步主链路</text><path d="M240 1162 H282" class="dash"/><text x="294" y="1167" class="small">异步任务 / 审批后恢复</text><rect x="486" y="1157" width="12" height="12" rx="3" fill="#102D43" stroke="#43D7C4"/><text x="510" y="1167" class="small">可信控制与校验边界</text><rect x="720" y="1157" width="12" height="12" rx="3" class="future"/><text x="744" y="1167" class="small">演进中能力，不作为当前完成承诺</text>
  <text x="1540" y="1167" class="small">事实依据：README · 已接受 ADR · 代码边界</text>
</svg>
