name: UI Review

on:
  schedule:
    # 视觉与设计 QA 不阻塞普通 PR；nightly 兜底发现跨浏览器视觉漂移。
    - cron: '47 2 * * *'
  workflow_dispatch:

# Q06：action 全部 pin 到审计过的 commit SHA（2026-08-07 审计，见
# docs/06-quality/08-供应链与发布证据.md），postgres 镜像 pin digest。
concurrency:
  # Scheduled and manually requested reviews are independent evidence runs.
  # A unique run group prevents either from cancelling another review.
  group: ui-${{ github.workflow }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ui:
    # 与默认 e2e 完全隔离的独立数据库；@ui 用例多为设计 QA 页与
    # worker 规则产物，不调用模型 Provider。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_ui_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_ui_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_ui_e2e
      E2E_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_ui_e2e
      PLAYWRIGHT_PORT: 3101
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers for full UI review
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Build production application
        run: pnpm build

      - name: Full UI review (@ui, Chromium + Firefox)
        id: ui_review
        run: pnpm exec playwright test --config playwright.ui.config.ts

      - name: Summarize retries and coverage matrix
        if: always()
        env:
          PLAYWRIGHT_RESULTS_REQUIRED: ${{ steps.ui_review.outcome == 'success' }}
        run: node tooling/quality/playwright-summary.mjs output/playwright/results.json --summary

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: playwright-ui-diagnostics
          path: output/playwright
          if-no-files-found: ignore
