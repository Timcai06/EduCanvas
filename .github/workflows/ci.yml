name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 完整稳定矩阵集中在 nightly；普通 PR / main push 只跑 Chromium smoke。
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      release_evidence:
        description: 'Validate release evidence pack'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Q06：action 全部 pin 到审计过的 commit SHA（2026-08-07 审计，审计过程与
# 升级流程见 docs/06-quality/08-供应链与发布证据.md）。pin 记录：
#   actions/checkout@v4                    -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4                  -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/upload-artifact@v4             -> ea165f8d65b6e75b540449e92b4886f43607fa02
#   pnpm/action-setup@v4                   -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   gitleaks/gitleaks-action@v2            -> ff98106e4c7b2bc287b24eaf42907196329070c7
#   actions/dependency-review-action@v4    -> 2031cfc080254a8a887f58cffee85186f0e49e48（v4 分支 = v4.9.0）
jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.impact.outputs.checks }}
      integration: ${{ steps.impact.outputs.integration }}
      windows: ${{ steps.impact.outputs.windows }}
      runtime_pressure: ${{ steps.impact.outputs.runtime_pressure }}
      e2e: ${{ steps.impact.outputs.e2e }}
      dependency_review: ${{ steps.impact.outputs.dependency_review }}
      desktop: ${{ steps.impact.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - name: Classify CI impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node tooling/quality/ci-impact.mjs
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  dependency-review:
    # Q06：恶意/高风险依赖变更门禁（license + 漏洞，fail-on-severity: high）。
    # 仅 PR 事件运行：action 需要 base/head ref 对比依赖差异，push 到 main 时
    # 没有 PR 上下文会直接报错（实测 2026-08-07 main run failure）。
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependency_review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 分支（= v4.9.0）
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    needs: [changes]
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag（版本取自根 package.json 的 packageManager 字段）

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node baseline gate
        run: pnpm node:gate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # Q05：核心包 coverage 门禁。阈值 = 2026-08-06 真实基线（防回归，
      # 只升不降），排除生成代码与纯类型，见各包 vitest.config.ts。
      - name: Coverage gates
        run: pnpm test:coverage

      # Q06：每个 migration 必须有语义/锁表/回滚/N-1/风险记录，
      # 见 packages/db/drizzle/MIGRATIONS.md。
      - name: Migration records gate
        run: node tooling/quality/migration-records.mjs

      - name: Repository file governance
        run: pnpm file:check

  integration:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Graphile Worker schema
        run: >-
          pnpm --filter @educanvas/worker exec graphile-worker
          --connection "$TEST_DATABASE_URL"
          --schema-only

      - name: PostgreSQL integration tests
        run: pnpm test:integration

  windows:
    needs: [changes]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local environment example
        run: pnpm env:check .env.example

      - name: Parse Windows startup scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 'start-educanvas.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 'stop-educanvas.ps1'))

      - name: Windows unit smoke
        run: pnpm --filter @educanvas/node-host test

  desktop-build:
    # 桌面助手（apps/desktop）独立 lane：测试 + electron-vite build + 产物校验。
    # 不打 portable 包（CI 只验证构建产物；打包在发布流程进行）。
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop unit tests
        run: pnpm --filter @educanvas/desktop test

      - name: Desktop typecheck
        run: pnpm --filter @educanvas/desktop typecheck

      - name: Desktop build
        run: pnpm --filter @educanvas/desktop build

      - name: Verify build artifacts
        run: |
          test -f apps/desktop/out/main/index.js
          test -f apps/desktop/out/preload/index.js
          test -f apps/desktop/out/renderer/index.html

  runtime-pressure:
    needs: [changes, quality]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.runtime_pressure == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: R28 OOPIF pressure gate
        run: pnpm test:e2e:runtime-pressure

  e2e:
    # Windows remains an independent required check, but it does not produce
    # artifacts or state consumed by the Linux browser suite.
    needs: [changes, quality, integration, runtime-pressure]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.quality.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.integration.result) &&
      contains(fromJSON('["success", "skipped"]'), needs['runtime-pressure'].result)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_e2e
      E2E_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_e2e
      PLAYWRIGHT_PORT: 3100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for PR smoke
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browsers for full regression
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # W06：完整稳定矩阵保留 Firefox；集中在 nightly / 手动预发布，不由普通 PR 支付。
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Build production application
        run: pnpm build

      - name: Persistent Web Runtime composition
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.runtime_pressure == 'true'
        run: pnpm test:e2e:runtime-composition

      - name: Browser E2E smoke (Chromium desktop)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm test:e2e:pr

      - name: Full browser E2E (Chromium desktop + mobile + Firefox)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright test

      # Q05：retry/flaky 显式报告（failOnFlakyTests 已让 flaky 在 CI 直接失败，
      # 这里把 retry 次数与 flaky 名单写入 CI Summary，不得完全隐藏）。
      - name: Summarize retries and coverage matrix
        if: always()
        run: node tooling/quality/playwright-summary.mjs output/playwright/results.json --summary

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: playwright-diagnostics
          path: output/playwright
          if-no-files-found: ignore

      # Q05 bundle/route size gate：放在全部测试之后执行——gate 失败仍让 job 红，
      # 但不再跳过 E2E 测试本身（#310：此前 gate 在测试前失败会 skip 全部 E2E，
      # 掩盖真实回归；构建产物已由上方 Build 生成）。
      - name: Bundle / route size gate
        run: node tooling/quality/bundle-size.mjs --root apps/web

  release-evidence:
    # PR 事件：收集证据状态快照（pending/skipped 不失败，见 validate-evidence.mjs
    # 语义——status 非终态时仅报告）；发布时 workflow_dispatch + input 强制
    # 终态校验（passed===total、failed 即失败）。2026-08-07 修复此前仅手动可达。
    if: >-
      always() &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_evidence == 'true')) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.checks == 'true' &&
      needs.secret-scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['dependency-review'].result) &&
      needs.quality.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.integration.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.windows.result) &&
      contains(fromJSON('["success", "skipped"]'), needs['runtime-pressure'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs.e2e.result) &&
      contains(fromJSON('["success", "skipped"]'), needs['desktop-build'].result)
    needs:
      [
        changes,
        secret-scan,
        dependency-review,
        quality,
        integration,
        windows,
        runtime-pressure,
        e2e,
        desktop-build,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release evidence pack
        run: node tooling/quality/validate-evidence.mjs

  checks:
    # Branch protection 只依赖这个稳定汇总上下文。它始终创建，并确保本次分类为
    # 应运行的 lane 全部成功；被分类为无关的 skipped lane 不会误报失败。
    if: always()
    needs:
      [
        changes,
        secret-scan,
        dependency-review,
        quality,
        integration,
        windows,
        runtime-pressure,
        e2e,
        desktop-build,
        release-evidence,
      ]
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHECKS_EXPECTED: ${{ needs.changes.outputs.checks }}
      INTEGRATION_EXPECTED: ${{ needs.changes.outputs.integration }}
      WINDOWS_EXPECTED: ${{ needs.changes.outputs.windows }}
      RUNTIME_PRESSURE_EXPECTED: ${{ needs.changes.outputs.runtime_pressure }}
      E2E_EXPECTED: ${{ needs.changes.outputs.e2e }}
      DEPENDENCY_REVIEW_EXPECTED: ${{ needs.changes.outputs.dependency_review }}
      DESKTOP_EXPECTED: ${{ needs.changes.outputs.desktop }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      RUNTIME_PRESSURE_RESULT: ${{ needs['runtime-pressure'].result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      DESKTOP_BUILD_RESULT: ${{ needs['desktop-build'].result }}
      RELEASE_EVIDENCE_RESULT: ${{ needs['release-evidence'].result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - name: Verify required lanes
        run: node tooling/quality/ci-impact.mjs --verify-results
