name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 完整稳定矩阵集中在 nightly；普通 PR / main push 只跑 Chromium smoke。
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      release_evidence:
        description: 'Validate release evidence pack'
        required: false
        type: boolean
        default: false

concurrency:
  # PR updates supersede older commits, while every main SHA keeps independent
  # evidence and cannot be cancelled by a later docs-only push.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Q06：action 全部 pin 到审计过的 commit SHA（2026-08-07 审计，审计过程与
# 升级流程见 docs/06-quality/08-供应链与发布证据.md）。pin 记录：
#   actions/checkout@v4                    -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4                  -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/upload-artifact@v4             -> ea165f8d65b6e75b540449e92b4886f43607fa02
#   pnpm/action-setup@v4                   -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   gitleaks/gitleaks-action@v2            -> ff98106e4c7b2bc287b24eaf42907196329070c7
#   actions/dependency-review-action@v4    -> 2031cfc080254a8a887f58cffee85186f0e49e48（v4 分支 = v4.9.0）
jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.impact.outputs.checks }}
      db_integration: ${{ steps.impact.outputs.db_integration }}
      worker_integration: ${{ steps.impact.outputs.worker_integration }}
      migration_integration: ${{ steps.impact.outputs.migration_integration }}
      windows: ${{ steps.impact.outputs.windows }}
      runtime_pressure: ${{ steps.impact.outputs.runtime_pressure }}
      e2e: ${{ steps.impact.outputs.e2e }}
      agent_eval: ${{ steps.impact.outputs.agent_eval }}
      dependency_review: ${{ steps.impact.outputs.dependency_review }}
      release_evidence: ${{ steps.impact.outputs.release_evidence }}
      desktop: ${{ steps.impact.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - name: Classify CI impact
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node tooling/quality/ci-impact.mjs
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  dependency-review:
    # Q06：恶意/高风险依赖变更门禁（license + 漏洞，fail-on-severity: high）。
    # 仅 PR 事件运行：action 需要 base/head ref 对比依赖差异，push 到 main 时
    # 没有 PR 上下文会直接报错（实测 2026-08-07 main run failure）。
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependency_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 分支（= v4.9.0）
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-static:
    needs: [changes]
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag（版本取自根 package.json 的 packageManager 字段）

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node baseline gate
        run: pnpm node:gate

      # Cheap governance failures must surface before the longer lint/typecheck
      # work so contributors do not wait several minutes for a sub-second gate.
      - name: Repository file governance
        run: pnpm file:check

      - name: Migration records gate
        run: node tooling/quality/migration-records.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  quality-tests:
    needs: [changes]
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag（版本取自根 package.json 的 packageManager 字段）

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      # Q05：核心包 coverage 门禁。阈值 = 2026-08-06 真实基线（防回归，
      # 只升不降），排除生成代码与纯类型，见各包 vitest.config.ts。
      - name: Coverage gates
        run: pnpm test:coverage

  db-integration:
    # D06：packages/db（Repository/Schema 非 drizzle）改动时运行 DB integration。
    needs: [changes]
    if: needs.changes.outputs.db_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Graphile Worker schema
        run: >-
          pnpm --filter @educanvas/worker exec graphile-worker
          --connection "$TEST_DATABASE_URL"
          --schema-only

      - name: DB integration tests
        run: pnpm test:integration:db

  worker-integration:
    # D06：apps/worker 与 packages/asset-processing 改动时运行 Worker integration；
    # 只准备 Worker 所需的数据库与 Graphile schema，不运行 DB full。
    needs: [changes]
    if: needs.changes.outputs.worker_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Graphile Worker schema
        run: >-
          pnpm --filter @educanvas/worker exec graphile-worker
          --connection "$TEST_DATABASE_URL"
          --schema-only

      - name: Worker integration tests
        run: pnpm test:integration:worker

  migration-integration:
    # D06：packages/db/drizzle/** 或 Schema 定义改动时，聚合独立 Migration 证据：
    # 历史不可变门禁 + 记录完整性 + schema/migration drift + fresh/N-1 集成测试，
    # 并在验证结束后确认没有生成 0054 或修改仓库。
    needs: [changes]
    if: needs.changes.outputs.migration_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_integration
      # schedule/workflow_dispatch 没有 before/base；此时用当前 SHA 做自检，不能把空 ref
      # 交给 fail-closed governance。PR/push 仍比较真实变更范围。
      BASE_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Historical migration immutability gate
        run: node tooling/quality/migration-governance.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Migration record completeness
        run: node tooling/quality/migration-records.mjs

      - name: Schema / migration drift check
        run: pnpm --dir packages/db exec drizzle-kit check

      - name: Regenerate must be a no-op
        run: >-
          pnpm --dir packages/db exec drizzle-kit generate &&
          git diff --exit-code -- packages/db/drizzle

      - name: Migration integration tests (fresh + N-1)
        run: pnpm test:integration:migrations

      - name: No generated migration artifacts
        run: >-
          test -z "$(git status --short packages/db/drizzle)" ||
          (echo "drizzle 目录被验证过程修改（可能生成了 0054）" && exit 1)

  windows:
    needs: [changes]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local environment example
        run: pnpm env:check .env.example

      - name: Parse Windows startup scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 'start-educanvas.ps1'))
          [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 'stop-educanvas.ps1'))

      - name: Windows unit smoke
        run: pnpm --filter @educanvas/node-host test

  desktop-build:
    # 桌面助手（apps/desktop）独立 lane：测试 + electron-vite build + 产物校验。
    # 不打 portable 包（CI 只验证构建产物；打包在发布流程进行）。
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop unit tests
        run: pnpm --filter @educanvas/desktop test

      - name: Desktop typecheck
        run: pnpm --filter @educanvas/desktop typecheck

      - name: Desktop build
        run: pnpm --filter @educanvas/desktop build

      - name: Verify build artifacts
        run: |
          test -f apps/desktop/out/main/index.js
          test -f apps/desktop/out/preload/index.js
          test -f apps/desktop/out/renderer/index.html

  runtime-pressure:
    needs: [changes, quality-static, quality-tests]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.runtime_pressure == 'true' &&
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') ||
       (needs['quality-static'].result == 'success' &&
        needs['quality-tests'].result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: R28 OOPIF pressure gate
        run: pnpm test:e2e:runtime-pressure

  e2e:
    # Windows remains an independent required check, but it does not produce
    # artifacts or state consumed by the Linux browser suite.
    needs:
      [
        changes,
        quality-static,
        quality-tests,
        db-integration,
        worker-integration,
        migration-integration,
        runtime-pressure,
      ]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' &&
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') ||
       (needs['quality-static'].result == 'success' &&
        needs['quality-tests'].result == 'success' &&
        contains(fromJSON('["success", "skipped"]'), needs['db-integration'].result) &&
        contains(fromJSON('["success", "skipped"]'), needs['worker-integration'].result) &&
        contains(fromJSON('["success", "skipped"]'), needs['migration-integration'].result) &&
        contains(fromJSON('["success", "skipped"]'), needs['runtime-pressure'].result)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_e2e
      E2E_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_e2e
      PLAYWRIGHT_PORT: 3100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for PR smoke
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browsers for full regression
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # W06：完整稳定矩阵保留 Firefox；集中在 nightly / 手动预发布，不由普通 PR 支付。
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Build production application
        run: pnpm build

      - name: Persistent Web Runtime composition
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.runtime_pressure == 'true'
        run: pnpm test:e2e:runtime-composition

      - name: Browser E2E smoke (Chromium desktop)
        id: browser_e2e_smoke
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm test:e2e:pr

      - name: Full browser E2E (Chromium desktop + mobile + Firefox)
        id: browser_e2e_full
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright test

      # Q05：retry/flaky 显式报告（failOnFlakyTests 已让 flaky 在 CI 直接失败，
      # 这里把 retry 次数与 flaky 名单写入 CI Summary，不得完全隐藏）。
      - name: Summarize retries and coverage matrix
        if: always()
        env:
          # A missing report is an evidence error only when Playwright reported
          # success. When the suite failed before producing JSON, keep the
          # original failure singular instead of adding a misleading second red.
          PLAYWRIGHT_RESULTS_REQUIRED: ${{ steps.browser_e2e_smoke.outcome == 'success' || steps.browser_e2e_full.outcome == 'success' }}
        run: node tooling/quality/playwright-summary.mjs output/playwright/results.json --summary

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: playwright-diagnostics
          path: output/playwright
          if-no-files-found: ignore

      - name: Extract golden journey evidence
        if: always() && (steps.browser_e2e_smoke.outcome == 'success' || steps.browser_e2e_full.outcome == 'success')
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tooling/quality/playwright-summary.mjs output/playwright/results.json --golden-evidence output/playwright/golden-journey-evidence.json

      - name: Upload E2E results for evidence v2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: e2e-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            output/playwright/results.json
            output/playwright/golden-journey-evidence.json
          if-no-files-found: ignore

      # Q05 bundle/route size gate：放在全部测试之后执行——gate 失败仍让 job 红，
      # 但不再跳过 E2E 测试本身（#310：此前 gate 在测试前失败会 skip 全部 E2E，
      # 掩盖真实回归；构建产物已由上方 Build 生成）。
      - name: Bundle / route size gate
        run: node tooling/quality/bundle-size.mjs --root apps/web

  agent-eval:
    # Frozen synthetic datasets exercise the existing Runtime and safety policy.
    # This lane never receives Provider secrets or real student content.
    needs: [changes]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.agent_eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b # Q06：digest pin（2026-08-07 审计）
        env:
          POSTGRES_USER: educanvas
          POSTGRES_PASSWORD: educanvas
          POSTGRES_DB: educanvas_agent_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educanvas -d educanvas_agent_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://educanvas:educanvas@localhost:5432/educanvas_agent_eval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 tag

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic Agent evaluation
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:eval && node tooling/evals/eval-gate.mjs --sha "$EVIDENCE_SHA"

      - name: Upload sanitized Agent evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: agent-eval-${{ github.event.pull_request.head.sha || github.sha }}
          path: tooling/evals/reports
          if-no-files-found: ignore

  release-evidence:
    # 发布证据、校验器或 migration/release governance 变更时才运行；普通功能 PR
    # 不为静态 RC manifest 支付独立 runner。手动发布仍由显式 input 开启。
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_evidence == 'true') ||
       (github.event_name != 'workflow_dispatch' && needs.changes.outputs.release_evidence == 'true')) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.checks == 'true' &&
      needs.secret-scan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['dependency-review'].result) &&
      needs['quality-static'].result == 'success' &&
      needs['quality-tests'].result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['db-integration'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['worker-integration'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['migration-integration'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs.windows.result) &&
      contains(fromJSON('["success", "skipped"]'), needs['runtime-pressure'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs.e2e.result) &&
      contains(fromJSON('["success", "skipped"]'), needs['agent-eval'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['desktop-build'].result)
    needs:
      [
        changes,
        secret-scan,
        dependency-review,
        quality-static,
        quality-tests,
        db-integration,
        worker-integration,
        migration-integration,
        windows,
        runtime-pressure,
        e2e,
        agent-eval,
        desktop-build,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - name: Validate release evidence draft
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_evidence != 'true'
        run: node tooling/quality/validate-evidence.mjs --mode draft

      - name: Validate release readiness
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_evidence == 'true'
        run: node tooling/quality/validate-evidence.mjs --mode release --sha "$GITHUB_SHA"

  checks:
    # Branch protection 只依赖这个稳定汇总上下文。它始终创建，并确保本次分类为
    # 应运行的 lane 全部成功；被分类为无关的 skipped lane 不会误报失败。
    if: always()
    needs:
      [
        changes,
        secret-scan,
        dependency-review,
        quality-static,
        quality-tests,
        db-integration,
        worker-integration,
        migration-integration,
        windows,
        runtime-pressure,
        e2e,
        agent-eval,
        desktop-build,
        release-evidence,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHECKS_EXPECTED: ${{ needs.changes.outputs.checks }}
      DB_INTEGRATION_EXPECTED: ${{ needs.changes.outputs.db_integration }}
      WORKER_INTEGRATION_EXPECTED: ${{ needs.changes.outputs.worker_integration }}
      MIGRATION_INTEGRATION_EXPECTED: ${{ needs.changes.outputs.migration_integration }}
      WINDOWS_EXPECTED: ${{ needs.changes.outputs.windows }}
      RUNTIME_PRESSURE_EXPECTED: ${{ needs.changes.outputs.runtime_pressure }}
      E2E_EXPECTED: ${{ needs.changes.outputs.e2e }}
      AGENT_EVAL_EXPECTED: ${{ needs.changes.outputs.agent_eval }}
      DEPENDENCY_REVIEW_EXPECTED: ${{ needs.changes.outputs.dependency_review }}
      RELEASE_EVIDENCE_EXPECTED: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_evidence == 'true') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.release_evidence == 'true') }}
      DESKTOP_EXPECTED: ${{ needs.changes.outputs.desktop }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
      QUALITY_STATIC_RESULT: ${{ needs['quality-static'].result }}
      QUALITY_TESTS_RESULT: ${{ needs['quality-tests'].result }}
      DB_INTEGRATION_RESULT: ${{ needs['db-integration'].result }}
      WORKER_INTEGRATION_RESULT: ${{ needs['worker-integration'].result }}
      MIGRATION_INTEGRATION_RESULT: ${{ needs['migration-integration'].result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      RUNTIME_PRESSURE_RESULT: ${{ needs['runtime-pressure'].result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      AGENT_EVAL_RESULT: ${{ needs['agent-eval'].result }}
      DESKTOP_BUILD_RESULT: ${{ needs['desktop-build'].result }}
      RELEASE_EVIDENCE_RESULT: ${{ needs['release-evidence'].result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag

      - name: Verify required lanes
        run: node tooling/quality/ci-impact.mjs --verify-results

      - name: Generate SHA-bound CI evidence
        if: always()
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node tooling/quality/ci-evidence.mjs
          --sha "$EVIDENCE_SHA"
          --event "$EVENT_NAME"
          --output output/ci-evidence/evidence.json

      - name: Upload SHA-bound CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/ci-evidence/evidence.json
          if-no-files-found: error

      - name: Download agent-eval artifact
        if: always()
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: agent-eval-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/agent-eval
        continue-on-error: true

      - name: Download e2e results artifact
        if: always()
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: e2e-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/e2e-results
        continue-on-error: true

      - name: Generate AI Product Evidence v2
        if: always()
        env:
          EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node tooling/quality/ai-product-evidence.mjs
          --sha "$EVIDENCE_SHA"
          --event "$EVENT_NAME"
          --eval-reports output/agent-eval
          --playwright-results output/e2e-results/results.json
          --output output/ai-product-evidence/evidence.json
          --summary

      - name: Upload AI Product Evidence v2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag
        with:
          name: ai-product-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/ai-product-evidence/evidence.json
          # A failing verdict still writes useful evidence. A pre-write parser error
          # should preserve the original red without adding a second artifact error.
          if-no-files-found: ignore
